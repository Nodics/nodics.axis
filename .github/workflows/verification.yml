name: Axis Verification

on:
  pull_request:
    branches:
      - development
      - master

jobs:
  verify:
    name: Verify on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    env:
      AXIS_BACKOFFICE_BASE_URL: http://127.0.0.1:4300
      AXIS_LOCATION_BASE_URL: http://127.0.0.1:4380/nodics/locationMap
      AXIS_WASTE_API_BASE_URL: http://127.0.0.1:4370/nodics/wasteApi
      AXIS_ENTERPRISE_CODE: default
      AXIS_PROJECT_CODE: nodics.kickoff
      AXIS_CLIENT_CONTRACT_VERSION: "1"
      AXIS_REQUEST_TIMEOUT_MS: "10000"
      AXIS_BROWSER_SESSION_CSRF_COOKIE_NAME: nodics_axis_csrf
      AXIS_ASSISTANT_MAXIMUM_EVENT_BYTES: "65536"
      AXIS_ASSISTANT_RECONNECT_WINDOW_MS: "120000"
      AXIS_ASSISTANT_IDLE_TIMEOUT_MS: "45000"
      AXIS_DEV_HOST: 0.0.0.0
      AXIS_DEV_PORT: "3100"
      AXIS_STRICT_PORT: "true"
      AXIS_BUILD_SOURCEMAP: "true"
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Show canonical workflow formatting
        run: |
          npx prettier .github/workflows/verification.yml --write
          git diff -- .github/workflows/verification.yml
          exit 1
      - name: Run repository verification
        run: npm run verify

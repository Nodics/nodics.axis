<!doctype html>
<!-- Synthetic confirmation renderer; no API calls or business mutations. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enterprise confirmation fixture</title>
  </head>
  <body>
    <div id="root" style="max-width: 900px; margin: 0 auto; padding: 16px"></div>
    <script type="module">
      import React from 'react';
      import { createRoot } from 'react-dom/client';
      import { AxisThemeProvider } from '/src/app/AxisThemeProvider.tsx';
      import { AssistantConfirmationCard } from '/src/cms/renderers/components/assistant/AssistantConfirmationCard.tsx';
      const section = (title, fields) => ({
        title,
        fields: Object.entries(fields).map(([label, value]) => ({ label, value })),
      });
      createRoot(document.getElementById('root')).render(
        React.createElement(
          AxisThemeProvider,
          null,
          React.createElement(AssistantConfirmationCard, {
            title: 'Enterprise and employee invitations',
            approveLabel: 'Approve',
            executeLabel: 'Execute',
            rejectLabel: 'Reject',
            expiredLabel: 'Expired',
            completedLabel: 'Completed',
            confirmation: {
              confirmationCode: 'synthetic',
              conversationCode: 'synthetic',
              operationId: 'profile.enterprise.onboard',
              state: 'PENDING',
              argumentsDigest: 'synthetic',
              revision: 1,
              expiresAt: '2030-01-01T00:00:00Z',
              impact: {
                summary:
                  'Create one enterprise and prepare three invitations, including the administrator. Invitees must complete registration; no employee account is activated by this action.',
                review: [
                  section('Enterprise', {
                    Code: 'DEMO_AI',
                    Name: 'Demonstration Enterprise',
                    'Administrator email': 'administrator@example.invalid',
                  }),
                  section('Employee invitation', {
                    Code: 'invitation-1',
                    Email: 'operations.manager@example.invalid',
                    Role: 'OPERATOR',
                    'Enterprise code': 'DEMO_AI',
                  }),
                  section('Employee invitation', {
                    Code: 'invitation-2',
                    Email: 'regional.audit.coordinator@example.invalid',
                    Role: 'VIEWER',
                    'Enterprise code': 'DEMO_AI',
                  }),
                ],
              },
            },
            onApprove: () => Promise.resolve(),
            onExecute: () => Promise.resolve(),
            onReject: () => Promise.resolve(),
          }),
        ),
      );
    </script>
  </body>
</html>

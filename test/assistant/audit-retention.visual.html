<!doctype html>
<!-- Isolated actual-renderer fixture; no runtime calls or deployed deletion. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Audit retention review</title>
  </head>
  <body>
    <div id="root" style="max-width: 960px; margin: 0 auto; padding: 16px"></div>
    <script type="module">
      import React from 'react';
      import { createRoot } from 'react-dom/client';
      import { AxisThemeProvider } from '/src/app/AxisThemeProvider.tsx';
      import { CopilotAuditRetentionPanel } from '/src/assistant/CopilotAuditRetentionPanel.tsx';
      const presentation = {
        title: 'Audit retention',
        kind: 'Audit category',
        TRANSCRIPT_ACCESS: 'Transcript access receipts',
        ACTION: 'Completed action audit',
        reason: 'Business reason',
        review: 'Review audit deletion',
        confirm: 'I confirm this irreversible audit deletion',
        execute: 'Delete reviewed batch',
        inspect: 'Inspect original operation',
        stop: 'Stop pending operation',
        operationCode: 'Operation reference',
        PREPARED: 'Prepared; deletion not confirmed',
        COMPLETED: 'Reviewed audit batch deleted',
        STOPPED: 'Stopped; no deletion committed',
        OUTCOME_UNKNOWN: 'Outcome unconfirmed. Inspect the original operation.',
        failed: 'Audit retention is unavailable. No deletion was retried.',
        count: 'Eligible records in this batch',
        cutoff: 'Retention cutoff',
        reference: 'Review reference',
      };
      const configuration = {
        accessToken: 'synthetic',
        enterpriseCode: 'enterprise',
        moduleBaseUrl: 'https://audit-fixture.invalid/copilot',
        timeoutMs: 1000,
      };
      presentation.release = 'Release retained policy fence';
      let completed = false;
      window.fetch = async (url, options) => {
        const address = new URL(url);
        if (address.hostname !== 'audit-fixture.invalid')
          throw new Error('Unexpected destination');
        const operation = address.pathname.split('/').at(-1);
        const body = JSON.parse(options.body);
        if (operation === 'execute') {
          completed = true;
          throw new Error('Synthetic lost acknowledgement');
        }
        const data = {
          contractVersion: 1,
          context: { tenantCode: 'tenant', enterpriseCode: 'enterprise' },
          operationCode: 'audit-retention-11111111-1111-1111-1111-111111111111',
          state:
            operation === 'preview' ? 'REVIEWED' : completed ? 'COMPLETED' : 'PREPARED',
          kind: body.kind || 'TRANSCRIPT_ACCESS',
          cutoff: '2025-10-01T00:00:00.000Z',
          count: 25,
          removed: completed ? 25 : 0,
          reviewDigest: 'a'.repeat(64),
        };
        return new Response(JSON.stringify({ code: 'SUC_COP_00000', data }));
      };
      createRoot(document.getElementById('root')).render(
        React.createElement(
          AxisThemeProvider,
          null,
          React.createElement(CopilotAuditRetentionPanel, {
            configuration,
            capability: {
              canDelete: true,
              kinds: ['TRANSCRIPT_ACCESS', 'ACTION'],
              presentation,
            },
          }),
        ),
      );
    </script>
  </body>
</html>
